name: Build matter-contact-sensor-h2

on:
  push:
    paths:
      - 'ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/**'
      - '.github/workflows/matter-contact-sensor-h2.yml'
  pull_request:
    paths:
      - 'ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/**'
      - '.github/workflows/matter-contact-sensor-h2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-H2/matter-thread/esp32h2_matter_contact_sensor
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request, build the PR head commit rather than the synthetic merge commit.
          # Empty on push/dispatch: default ref.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build (esp32h2)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32h2
          idf.py build
          idf.py merge-bin -o esp32h2_matter_contact_sensor_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: esp32h2_matter_contact_sensor
          if-no-files-found: error
          path: |
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/esp32h2_matter_contact_sensor.bin
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/bootloader/bootloader.bin
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/partition_table/partition-table.bin
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/ota_data_initial.bin
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/flash_args
            ESP32-H2/matter-thread/esp32h2_matter_contact_sensor/build/esp32h2_matter_contact_sensor_merged.bin
