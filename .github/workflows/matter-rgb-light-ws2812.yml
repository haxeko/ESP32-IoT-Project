name: Build matter-rgb-light-ws2812

on:
  push:
    paths:
      - 'ESP32-S2/matter-wifi/matter-rgb-light-ws2812/**'
      - '.github/workflows/matter-rgb-light-ws2812.yml'
  pull_request:
    paths:
      - 'ESP32-S2/matter-wifi/matter-rgb-light-ws2812/**'
      - '.github/workflows/matter-rgb-light-ws2812.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-S2/matter-wifi/matter-rgb-light-ws2812
    steps:
      - uses: actions/checkout@v4
      - name: Build (esp32s2)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32s2
          idf.py build
          idf.py merge-bin -o matter_rgb_light_ws2812_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_rgb_light_ws2812-esp32s2
          path: |
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/matter_rgb_light_ws2812.bin
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/bootloader/bootloader.bin
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/partition_table/partition-table.bin
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/ota_data_initial.bin
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/flash_args
            ESP32-S2/matter-wifi/matter-rgb-light-ws2812/build/matter_rgb_light_ws2812_merged.bin
