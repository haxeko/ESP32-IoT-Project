name: Build matter-ble-presence two-chip (ESP32-C3 scanner + ESP32-H2)

on:
  push:
    paths:
      - 'ESP32-C3/ble-presence-scanner/**'
      - 'ESP32-H2/matter-ble-presence-h2/**'
      - 'ESP32-C6/matter-ble-presence/**' # the shared code
      - '.github/workflows/matter-ble-presence-2chip.yml'
  pull_request:
    paths:
      - 'ESP32-C3/ble-presence-scanner/**'
      - 'ESP32-H2/matter-ble-presence-h2/**'
      - 'ESP32-C6/matter-ble-presence/**'
      - '.github/workflows/matter-ble-presence-2chip.yml'
  workflow_dispatch:

# Host tests and the test of the web page run in matter-ble-presence-c6.yml (same code)
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: ESP32-C3/ble-presence-scanner
            target: esp32c3
            name: ble_presence_scanner_c3
          - dir: ESP32-H2/matter-ble-presence-h2
            target: esp32h2
            name: matter_ble_presence_h2
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (${{ matrix.target }})
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py size
          idf.py merge-bin -o ${{ matrix.name }}_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ matrix.dir }}/build/${{ matrix.name }}.bin
            ${{ matrix.dir }}/build/${{ matrix.name }}.elf
            ${{ matrix.dir }}/build/bootloader/bootloader.bin
            ${{ matrix.dir }}/build/partition_table/partition-table.bin
            ${{ matrix.dir }}/build/flash_args
            ${{ matrix.dir }}/build/${{ matrix.name }}_merged.bin
