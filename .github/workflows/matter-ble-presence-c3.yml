name: Build matter-ble-presence (ESP32-C3)

on:
  push:
    paths:
      - 'ESP32-C3/matter-ble-presence/**'
      - 'ESP32-C6/matter-ble-presence/**' # the shared code
      - '.github/workflows/matter-ble-presence-c3.yml'
  pull_request:
    paths:
      - 'ESP32-C3/matter-ble-presence/**'
      - 'ESP32-C6/matter-ble-presence/**'
      - '.github/workflows/matter-ble-presence-c3.yml'
  workflow_dispatch:

# Host tests and the test of the web page run in matter-ble-presence-c6.yml (same code)
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-C3/matter-ble-presence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32c3)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32c3
          idf.py build
          idf.py size
          idf.py merge-bin -o matter_ble_presence_c3_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_ble_presence_c3-esp32c3
          if-no-files-found: error
          path: |
            ESP32-C3/matter-ble-presence/build/matter_ble_presence_c3.bin
            ESP32-C3/matter-ble-presence/build/matter_ble_presence_c3.elf
            ESP32-C3/matter-ble-presence/build/bootloader/bootloader.bin
            ESP32-C3/matter-ble-presence/build/partition_table/partition-table.bin
            ESP32-C3/matter-ble-presence/build/flash_args
            ESP32-C3/matter-ble-presence/build/matter_ble_presence_c3_merged.bin
