name: Build matter-presence-sensor

on:
  push:
    paths:
      - 'matter-presence-sensor/firmware/**'
      - '.github/workflows/matter-presence-sensor.yml'
  pull_request:
    paths:
      - 'matter-presence-sensor/firmware/**'
      - '.github/workflows/matter-presence-sensor.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++, no ESP-IDF)
        run: matter-presence-sensor/firmware/test/host/run.sh

  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    strategy:
      fail-fast: false
      matrix:
        board: [c3-supermini, c3-wroom-devkit, c3-radar-r45, h2-mini]
    defaults:
      run:
        working-directory: matter-presence-sensor/firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build ${{ matrix.board }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          tools/build.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: presence-${{ matrix.board }}
          path: matter-presence-sensor/firmware/dist/
