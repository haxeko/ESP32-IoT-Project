name: Build matter-presence-h2-thread

on:
  push:
    paths:
      - 'ESP32-H2/matter-thread/matter-presence-occupancy/**'
      - '.github/workflows/matter-presence-h2-thread.yml'
  pull_request:
    paths:
      - 'ESP32-H2/matter-thread/matter-presence-occupancy/**'
      - '.github/workflows/matter-presence-h2-thread.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-H2/matter-thread/matter-presence-occupancy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32h2)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32h2
          idf.py build
          idf.py merge-bin -o matter_presence_h2_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_presence_h2-esp32h2
          path: |
            ESP32-H2/matter-thread/matter-presence-occupancy/build/matter_presence_h2.bin
            ESP32-H2/matter-thread/matter-presence-occupancy/build/bootloader/bootloader.bin
            ESP32-H2/matter-thread/matter-presence-occupancy/build/partition_table/partition-table.bin
            ESP32-H2/matter-thread/matter-presence-occupancy/build/ota_data_initial.bin
            ESP32-H2/matter-thread/matter-presence-occupancy/build/flash_args
            ESP32-H2/matter-thread/matter-presence-occupancy/build/matter_presence_h2_merged.bin
            ESP32-H2/matter-thread/matter-presence-occupancy/build/matter_presence_h2_update.bin
