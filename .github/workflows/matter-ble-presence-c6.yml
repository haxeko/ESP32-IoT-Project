name: Build matter-ble-presence (ESP32-C6)

on:
  push:
    paths:
      - 'ESP32-C6/matter-ble-presence/**'
      - '.github/workflows/matter-ble-presence-c6.yml'
  pull_request:
    paths:
      - 'ESP32-C6/matter-ble-presence/**'
      - '.github/workflows/matter-ble-presence-c6.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++ with AddressSanitizer / UBSan, no ESP-IDF)
        run: ESP32-C6/matter-ble-presence/test/host/run.sh

  web-ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ESP32-C6/matter-ble-presence/test/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless check of the configuration page (Playwright, mocked device API)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node ui_test.js

  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-C6/matter-ble-presence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32c6)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32c6
          idf.py build
          idf.py size
          idf.py merge-bin -o matter_ble_presence_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_ble_presence-esp32c6
          if-no-files-found: error
          path: |
            ESP32-C6/matter-ble-presence/build/matter_ble_presence.bin
            ESP32-C6/matter-ble-presence/build/matter_ble_presence.elf
            ESP32-C6/matter-ble-presence/build/bootloader/bootloader.bin
            ESP32-C6/matter-ble-presence/build/partition_table/partition-table.bin
            ESP32-C6/matter-ble-presence/build/flash_args
            ESP32-C6/matter-ble-presence/build/matter_ble_presence_merged.bin
