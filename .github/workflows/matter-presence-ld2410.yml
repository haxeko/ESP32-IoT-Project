name: Build matter-presence-ld2410

on:
  push:
    paths:
      - 'ESP32-S2/matter-wifi/matter-presence-ld2410/**'
      - '.github/workflows/matter-presence-ld2410.yml'
  pull_request:
    paths:
      - 'ESP32-S2/matter-wifi/matter-presence-ld2410/**'
      - '.github/workflows/matter-presence-ld2410.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-S2/matter-wifi/matter-presence-ld2410
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32s2)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32s2
          idf.py build
          idf.py merge-bin -o matter_presence_ld2410_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_presence_ld2410-esp32s2
          path: |
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/matter_presence_ld2410.bin
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/bootloader/bootloader.bin
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/partition_table/partition-table.bin
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/ota_data_initial.bin
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/flash_args
            ESP32-S2/matter-wifi/matter-presence-ld2410/build/matter_presence_ld2410_merged.bin
