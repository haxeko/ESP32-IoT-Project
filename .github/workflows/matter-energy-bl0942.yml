name: Build matter-energy-bl0942

on:
  push:
    paths:
      - 'ESP32-C3/matter-wifi/matter-energy-bl0942/**'
      - '.github/workflows/matter-energy-bl0942.yml'
  pull_request:
    paths:
      - 'ESP32-C3/matter-wifi/matter-energy-bl0942/**'
      - '.github/workflows/matter-energy-bl0942.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-C3/matter-wifi/matter-energy-bl0942
    steps:
      - uses: actions/checkout@v4
      - name: Build (esp32c3)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32c3
          idf.py build
          idf.py merge-bin -o matter_plug_bl0942_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_plug_bl0942-esp32c3
          path: |
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/matter_plug_bl0942.bin
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/bootloader/bootloader.bin
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/partition_table/partition-table.bin
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/ota_data_initial.bin
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/flash_args
            ESP32-C3/matter-wifi/matter-energy-bl0942/build/matter_plug_bl0942_merged.bin
