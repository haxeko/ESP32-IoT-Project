name: Build matter-relay-h2-thread

on:
  push:
    paths:
      - 'ESP32-H2/matter-thread/matter-relay-switch/**'
      - '.github/workflows/matter-relay-h2-thread.yml'
  pull_request:
    paths:
      - 'ESP32-H2/matter-thread/matter-relay-switch/**'
      - '.github/workflows/matter-relay-h2-thread.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-H2/matter-thread/matter-relay-switch
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request, build the PR head commit rather than the synthetic merge commit, so the git hash
          # in the firmware version exists on a branch. Empty on push/dispatch: default ref.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build (esp32h2)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32h2
          idf.py build
          idf.py merge-bin -o matter_relay_h2_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_relay_h2-esp32h2
          path: |
            ESP32-H2/matter-thread/matter-relay-switch/build/matter_relay_h2.bin
            ESP32-H2/matter-thread/matter-relay-switch/build/bootloader/bootloader.bin
            ESP32-H2/matter-thread/matter-relay-switch/build/partition_table/partition-table.bin
            ESP32-H2/matter-thread/matter-relay-switch/build/ota_data_initial.bin
            ESP32-H2/matter-thread/matter-relay-switch/build/flash_args
            ESP32-H2/matter-thread/matter-relay-switch/build/matter_relay_h2_merged.bin
            ESP32-H2/matter-thread/matter-relay-switch/build/matter_relay_h2-ota.bin
      # ELF/map decode silent-assert and panic addresses from a CI-flashed device
      - uses: actions/upload-artifact@v4
        with:
          name: matter_relay_h2-esp32h2-debug
          path: |
            ESP32-H2/matter-thread/matter-relay-switch/build/matter_relay_h2.elf
            ESP32-H2/matter-thread/matter-relay-switch/build/matter_relay_h2.map
