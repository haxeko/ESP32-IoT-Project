name: Build matter-ens160-aht21

on:
  push:
    paths:
      - 'ESP32-C3/matter-wifi/matter-ens160-aht21/**'
      - '.github/workflows/matter-ens160-aht21.yml'
  pull_request:
    paths:
      - 'ESP32-C3/matter-wifi/matter-ens160-aht21/**'
      - '.github/workflows/matter-ens160-aht21.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++, no ESP-IDF)
        run: ESP32-C3/matter-wifi/matter-ens160-aht21/test/host/run.sh

  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          # ENS160 + AHT21 module
          - variant: sensor
            defaults: sdkconfig.defaults
          # Simulated temperature and humidity, no module (sdkconfig.defaults.simulated)
          - variant: simulated
            defaults: sdkconfig.defaults;sdkconfig.defaults.simulated
    defaults:
      run:
        working-directory: ESP32-C3/matter-wifi/matter-ens160-aht21
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32c3, ${{ matrix.variant }})
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          dir=build/${{ matrix.variant }}
          idf.py -B $dir -D IDF_TARGET=esp32c3 -D SDKCONFIG=$dir/sdkconfig -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
          idf.py -B $dir -D IDF_TARGET=esp32c3 -D SDKCONFIG=$dir/sdkconfig -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" \
            merge-bin -o matter_ens160_aht21_merged.bin
          # Matter OTA image (CONFIG_CHIP_OTA_IMAGE_BUILD); .ota is the extension controllers expect
          cp $dir/matter_ens160_aht21-ota.bin $dir/matter_ens160_aht21.ota
      - uses: actions/upload-artifact@v4
        with:
          name: matter_ens160_aht21-esp32c3-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/matter_ens160_aht21.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/bootloader/bootloader.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/partition_table/partition-table.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/ota_data_initial.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/flash_args
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/matter_ens160_aht21_merged.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/${{ matrix.variant }}/matter_ens160_aht21.ota
