name: Build matter-ens160-aht21

on:
  push:
    paths:
      - 'ESP32-C3/matter-wifi/matter-ens160-aht21/**'
      - '.github/workflows/matter-ens160-aht21.yml'
  pull_request:
    paths:
      - 'ESP32-C3/matter-wifi/matter-ens160-aht21/**'
      - '.github/workflows/matter-ens160-aht21.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++, no ESP-IDF)
        run: ESP32-C3/matter-wifi/matter-ens160-aht21/test/host/run.sh

  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    defaults:
      run:
        working-directory: ESP32-C3/matter-wifi/matter-ens160-aht21
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the firmware version is the git commit count
      - name: Build (esp32c3)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32c3
          idf.py build
          idf.py merge-bin -o matter_ens160_aht21_merged.bin
          # Matter OTA image (CONFIG_CHIP_OTA_IMAGE_BUILD); .ota is the extension controllers expect
          cp build/matter_ens160_aht21-ota.bin build/matter_ens160_aht21.ota
      - uses: actions/upload-artifact@v4
        with:
          name: matter_ens160_aht21-esp32c3
          if-no-files-found: error
          path: |
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/matter_ens160_aht21.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/bootloader/bootloader.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/partition_table/partition-table.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/ota_data_initial.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/flash_args
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/matter_ens160_aht21_merged.bin
            ESP32-C3/matter-wifi/matter-ens160-aht21/build/matter_ens160_aht21.ota
